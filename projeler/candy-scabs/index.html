      body {

      .social {

        box-shadow: 0 0 12px rgba(255, 130, 30, 0.12);

      .line {

        margin: 24px auto;
        background: linear-gradient(

          transparent,

        );
      }

      .content {
        width: 82%;

      }

      .game-title {
        text-align: center;

      }

      .game-title h1 {

        color: #fff0df;
        letter-spacing: 2px;
        text-shadow: 0 0 14px rgba(255, 150, 50, 0.4);
      }

      .section-box {
        background: rgba(42, 24, 12, 0.82);
        border: 1px solid rgba(255, 165, 80, 0.22);
        border-radius: 18px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
        padding: 28px;
        backdrop-filter: blur(2px);
      }

      .logo-area {

      }

      .logo-area img {

        width: 520px;
        filter: drop-shadow(0 0 18px rgba(255, 150, 50, 0.28));

      .section-title {

        color: #ffe8d0;
        font-size: 30px;
        text-align: center;
        text-shadow: 0 0 10px rgba(255, 165, 80, 0.2);
      }

      /* SLIDER */
      .slider-wrapper {
        max-width: 900px;
        margin: 0 auto;
      }

      .image-slider {
        position: relative;
        width: 100%;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(255, 130, 50, 0.25);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .slides {
        display: flex;
        transition: transform 0.4s ease;
      }

      .slides img {
        width: 100%;
        flex-shrink: 0;
        display: block;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #241508;
      }

      .slider-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 52px;
        height: 52px;
        border: 1px solid rgba(255, 180, 100, 0.22);
        border-radius: 50%;
        cursor: pointer;
        background: rgba(90, 45, 15, 0.88);
        color: #ffffff;
        font-size: 24px;
        z-index: 2;
        box-shadow: 0 0 12px rgba(255, 120, 40, 0.18);
      }

      .slider-btn:hover {
        background: rgba(195, 95, 25, 0.96);
      }

      .slider-btn.prev {
        left: 16px;
      }

      .slider-btn.next {
        right: 16px;
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        cursor: pointer;
        border: 1px solid rgba(255, 180, 100, 0.15);
      }

      .dot.active {
        background: #ffc58a;
        box-shadow: 0 0 10px rgba(255, 130, 40, 0.65);
      }

      /* AÇIKLAMA */
      .description-text {
        max-width: 900px;
        margin: 0 auto;
        text-align: center;
        font-size: 21px;
        line-height: 1.8;
        color: #fce8d5;
      }

      /* EMEĞİ GEÇENLER */
      .staff-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
        margin-top: 10px;
      }

      .staff-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 165, 80, 0.18);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        box-shadow: inset 0 0 10px rgba(255, 165, 80, 0.03);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease;
      }

      .staff-card:hover {
        transform: translateY(-5px);
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.3),
          0 0 18px rgba(255, 130, 40, 0.25);
        border-color: rgba(255, 165, 90, 0.65);
      }

      .staff-card h3 {
        margin: 0 0 10px 0;
        color: #fff0df;
        font-size: 24px;
      }

      .staff-card p {
        margin: 0;
        font-size: 18px;
        line-height: 1.6;
        color: #f4dfcc;
      }

      /* SİSTEM GEREKSİNİMLERİ */
      .req-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 22px;
        max-width: 900px;
        margin: 0 auto;
        justify-items: center;
      }

      .req-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 165, 80, 0.18);
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        width: 100%;
        max-width: 400px;
      }

      .req-card h3 {
        margin: 0 0 16px 0;

        text-align: center;
      }

      .req-card p {

        line-height: 1.6;
        color: #f4dfcc;
      }

      /* LİNKLER */
      .download-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 18px;
      }

      .download-btn {

        box-shadow: 0 0 12px rgba(255, 130, 30, 0.08);
      }

      .download-btn:hover {
        background: rgba(115, 60, 20, 0.95);
        transform: translateY(-2px);
      }

      @media (max-width: 900px) {

        color: white;
        border: none;
      }

      }

    <script>
      let currentSlide = 0;
      const slides = document.getElementById("slides");
      const dots = document.querySelectorAll(".dot");
      const totalSlides = slides.children.length;

      function updateSlider() {
        slides.style.transform = `translateX(-${currentSlide * 100}%)`;

        dots.forEach((dot, index) => {
          dot.classList.toggle("active", index === currentSlide);
        });
      }

      function changeSlide(step) {
        currentSlide += step;

        if (currentSlide < 0) currentSlide = totalSlides - 1;
        if (currentSlide >= totalSlides) currentSlide = 0;

        updateSlider();
      }

      function goToSlide(index) {
        currentSlide = index;
        updateSlider();
      }
      let autoSlide;

      function startAutoSlide() {
        clearInterval(autoSlide);
        autoSlide = setInterval(() => {
          changeSlide(1);
        }, 5000);
      }

      function stopAutoSlide() {
        clearInterval(autoSlide);
      }

      startAutoSlide();

      document.querySelectorAll(".slides video").forEach((video) => {
        video.addEventListener("play", stopAutoSlide);

        video.addEventListener("ended", () => {
          changeSlide(1);
          startAutoSlide();
        });
      });
    </script>
