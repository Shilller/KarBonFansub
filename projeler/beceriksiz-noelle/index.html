<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" href="icon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beceriksiz Noelle</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <style>
        body {
            margin: 0;
            font-family: "Comic Sans MS", cursive;
            background:
                linear-gradient(rgba(32, 68, 249, 0.82), rgba(36, 87, 174, 0.9)),
                url("arka-plan.jpg") center/cover fixed no-repeat;
            color: #eef7ff;
        }

        .theme-overlay {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(rgba(170, 210, 255, 0.06), rgba(255, 255, 255, 0.02));
        }

        .logo img {
            height: 60px;
            filter: drop-shadow(0 0 10px rgba(180, 220, 255, 0.18));
        }

        .top-menu .btn,
        .bottom-menu .btn {
            background: rgba(20, 42, 72, 0.9);
            color: #f4fbff;
            border: 1px solid rgba(190, 225, 255, 0.2);
            box-shadow: 0 0 12px rgba(110, 180, 255, 0.08);
        }

        .top-menu .btn:hover,
        .bottom-menu .btn:hover {
            background: rgba(74, 144, 230, 0.96);
        }

        .social {
            background: rgba(20, 42, 72, 0.9);
            color: #f4fbff;
            border: 1px solid rgba(190, 225, 255, 0.2);
            box-shadow: 0 0 12px rgba(110, 180, 255, 0.12);
        }

        .social:hover {
            background: rgba(36, 68, 110, 0.95);
        }

        .line {
            width: 80%;
            height: 1px;
            margin: 24px auto;
            background: linear-gradient(to right, transparent, rgba(180, 225, 255, 0.7), transparent);
        }

        .content {
            width: 82%;
            margin: auto;
        }

        .game-title {
            text-align: center;
            margin: 30px 0 10px 0;
        }

        .game-title h1 {
            margin: 0;
            font-size: 46px;
            color: #f3faff;
            letter-spacing: 2px;
            text-shadow: 0 0 14px rgba(170, 220, 255, 0.4);
        }

        .section-box {
            background: rgba(10, 22, 40, 0.72);
            border: 1px solid rgba(175, 215, 255, 0.22);
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
            padding: 28px;
            backdrop-filter: blur(2px);
        }

        .logo-area {
            text-align: center;
        }

        .logo-area img {
            max-width: 100%;
            width: 520px;
            filter: drop-shadow(0 0 18px rgba(180, 220, 255, 0.28));
        }

        .section-title {
            margin: 0 0 20px 0;
            color: #f1f8ff;
            font-size: 30px;
            text-align: center;
            text-shadow: 0 0 10px rgba(180, 220, 255, 0.2);
        }

        /* SLIDER */
        .slider-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .image-slider {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid rgba(184, 95, 95, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            }

        .slides {
            display: flex;
            transition: transform 0.4s ease;
        }

        .slides img {
            width: 100%;
            flex-shrink: 0;
            display: block;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #0c1624;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border: 1px solid rgba(200, 230, 255, 0.22);
            border-radius: 50%;
            cursor: pointer;
            background: rgba(28, 55, 90, 0.88);
            color: #ffffff;
            font-size: 24px;
            z-index: 2;
            box-shadow: 0 0 12px rgba(120, 190, 255, 0.18);
        }

        .slider-btn:hover {
            background: rgba(28, 102, 193, 0.96);
        }

        .slider-btn.prev {
            left: 16px;
        }

        .slider-btn.next {
            right: 16px;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
            cursor: pointer;
            border: 1px solid rgba(200, 230, 255, 0.15);
        }

        .dot.active {
            background: #dff3ff;
            box-shadow: 0 0 10px rgba(83, 118, 140, 0.65);
        }

        /* AÇIKLAMA */
        .description-text {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            font-size: 21px;
            line-height: 1.8;
            color: #e7f3ff;
        }

        /* EMEĞİ GEÇENLER */
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin-top: 10px;
        }

        .staff-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(175, 215, 255, 0.18);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(170, 215, 255, 0.03);
        }

        .staff-card h3 {
            margin: 0 0 10px 0;
            color: #f3faff;
            font-size: 24px;
        }

        .staff-card p {
            margin: 0;
            font-size: 18px;
            line-height: 1.6;
            color: #dceeff;
        }

        /* SİSTEM GEREKSİNİMLERİ */
        .req-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
            max-width: 900px;
            margin: 0 auto;
            justify-items: center;
        }

        .req-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(175, 215, 255, 0.18);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
            width: 100%;
            max-width: 400px;
        }

        .req-card h3 {
            margin: 0 0 16px 0;
            color: #f3faff;
            font-size: 26px;
            text-align: center;
        }

        .req-card p {
            margin: 10px 0;
            font-size: 18px;
            line-height: 1.6;
            color: #dceeff;
        }

        /* LİNKLER */
        .download-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            background: rgba(0, 102, 255, 0.92);
            color: #f5fbff;
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 20px;
            border: 1px solid rgba(190, 225, 255, 0.22);
            transition: 0.2s ease;
            box-shadow: 0 0 12px rgba(110, 180, 255, 0.08);
        }

        .download-btn:hover {
            background: rgba(36, 68, 110, 0.95);
            transform: translateY(-2px);
        }

        @media (max-width: 900px) {
            .staff-grid {
                grid-template-columns: 1fr;
            }

            .req-grid {
                grid-template-columns: 1fr;
            }

            .game-title h1 {
                font-size: 36px;
            }

            .description-text {
                font-size: 18px;
            }
        }
            .social.yt {
            background: #ff0000;
            color: white;
            border: none;
            }

            .social.dc {
            background: #5865F2;
            color: white;
            border: none;
            }
    </style>
</head>

        <div class="content">

            <!-- OYUN LOGOSU -->
            <div class="game-title">

            </div>

            <div class="section-box logo-area">
                <img src="BECERIKSIZ_NOELLE3.png" alt="Noelle Logo">

            <!-- SLIDER -->
            <div class="section-box">

    <script>
        let currentSlide = 0;
        const slides = document.getElementById("slides");
        const dots = document.querySelectorAll(".dot");
        const totalSlides = slides.children.length;

        function updateSlider() {
            slides.style.transform = `translateX(-${currentSlide * 100}%)`;

            dots.forEach((dot, index) => {
                dot.classList.toggle("active", index === currentSlide);
            });
        }

        function changeSlide(step) {
            currentSlide += step;

            if (currentSlide < 0) currentSlide = totalSlides - 1;
            if (currentSlide >= totalSlides) currentSlide = 0;

            updateSlider();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlider();
        }
    </script>
