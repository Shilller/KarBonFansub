    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404</title>

    <link rel="stylesheet" href="/style.css" />

    <style>
      @font-face {
        font-family: "ComicCustom";
        src: url("/fonts/ComicSansMS.ttf") format("truetype");
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #c4d6da;
        color: white;
        text-align: center;
        font-family: "ComicCustom", sans-serif;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
      }

      h1 {
        font-size: 110px;
        margin: 0;
      }

      .logo {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .logo img {
        width: 320px;
        max-width: 100%;
        height: auto;
        display: block;
      }

      h2 {
        margin: 0;
      }

      p {
        margin: 0;
      }

      .btn {
        margin-top: 10px;
        font-size: 22px;
        padding: 18px 36px;
        display: inline-block;
      }

      .error-image {
        display: block;
        margin: 20px auto;
      }

      .error-image img {
        display: block;
        width: 650px;
        max-width: 90%;
        height: auto;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404 Geçersiz sayfa</h1>

      <a href="/" class="error-image">
        <img src="/404.png" alt="404 Fotoğrafı" />
      </a>

      <h2>Sayfa Bulunamadı</h2>

      <p>Aradığınız sayfa silinmiş, taşınmış veya hiç var olmamış olabilir.</p>

      <a href="/" class="btn">Ana Sayfaya Dön</a>
    </div>
  </body>
</html>
